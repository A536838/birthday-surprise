<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sabari ❤️</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-family:Georgia,serif;
  background:linear-gradient(135deg,#ffd6e7,#fff0f6);
  overflow:hidden;
}

.card{
  width:88%;
  max-width:400px;
  padding:30px 20px;
  background:rgba(255,255,255,.75);
  border-radius:28px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.teddy{
  font-size:85px;
}

h1{
  color:#c83d78;
}

input{
  padding:14px;
  width:80%;
  border:2px solid #f3a4c2;
  border-radius:25px;
  text-align:center;
  font-size:17px;
  outline:none;
}

button{
  margin-top:15px;
  padding:13px 25px;
  border:0;
  border-radius:25px;
  background:#d9467a;
  color:white;
  font-size:16px;
}

#surprise{
  display:none;
}

.bouquet{
  font-size:85px;
}

.heart{
  font-size:70px;
  animation:beat 1s infinite;
}

.message{
  color:#7d3858;
  font-size:18px;
  line-height:1.6;
}

@keyframes beat{
  50%{transform:scale(1.15)}
}

#error{
  color:#d33;
  display:none;
}
</style>
</head>

<body>

<div class="card">

  <div id="lock">
    <div class="teddy">🧸</div>

    <h1>For Sabari ❤️</h1>

    <p>Enter our special date 🔐</p>

    <div class="heart">❤️</div>

    <input id="password" type="text" placeholder="DD/MM/YYYY">

    <br>

    <button onclick="openSurprise()">Open My Surprise 💌</button>

    <p id="error">Wrong date 😝 Try again ❤️</p>
  </div>


  <div id="surprise">

    <div class="bouquet">💐</div>

    <div class="heart">❤️</div>

    <h1>Happy Birthday Sabari! 🎂❤️</h1>

    <p class="message">
      You are very special to me. 🥹❤️<br><br>
      I hope this little surprise makes you smile. 💐<br>
      Stay happy, stay cute and always be you. 🫶❤️
    </p>

    <div style="font-size:35px;">
      🌸🌷🌹🌷🌸
    </div>

  </div>

</div>

<script>
function openSurprise(){

  const password =
    document.getElementById("password").value.trim();

  if(password === "15/10/2025"){

    document.getElementById("lock").style.display="none";
    document.getElementById("surprise").style.display="block";

  }else{

    document.getElementById("error").style.display="block";

  }
}
</script>

</body>
</html>
