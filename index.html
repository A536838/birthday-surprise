<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💐❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia,serif;
  background:linear-gradient(135deg,#ffd6e7,#fff1f7,#ffd1df);
  overflow:hidden;
  text-align:center;
}

.container{
  width:92%;
  max-width:430px;
}

h1{
  color:#c83d78;
  font-size:30px;
}

.bouquet{
  font-size:90px;
  cursor:pointer;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  50%{transform:translateY(-12px)}
}

.teddy{
  font-size:65px;
  margin-top:10px;
}

.heart{
  margin:20px auto;
  width:260px;
  min-height:130px;
  background:#ff5c91;
  color:white;
  padding:35px 25px;
  clip-path:polygon(
    50% 100%,0 35%,0 18%,8% 5%,22% 0,
    35% 5%,50% 20%,65% 5%,78% 0,
    92% 5%,100% 18%,100% 35%
  );
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
  line-height:1.5;
}

button{
  border:0;
  padding:13px 25px;
  border-radius:25px;
  background:#d9467a;
  color:white;
  font-size:16px;
  cursor:pointer;
}

#surprise{
  display:none;
}

.small{
  color:#8b4260;
  font-size:15px;
}

.heartDrop{
  position:fixed;
  top:-30px;
  animation:fall 4s linear forwards;
  font-size:25px;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="container">

  <div id="locked">
    <h1>💌 A Little Surprise For You 💌</h1>
    <div class="teddy">🧸</div>
    <p class="small">
      This surprise will open on your special date ❤️
    </p>
    <p id="dateText"></p>
  </div>

  <div id="surprise">

    <h1>For My Special Person 💖</h1>

    <div class="bouquet">💐</div>

    <div class="teddy">🧸</div>

    <div class="heart">
      Happy Birthday, My Love! ❤️<br><br>
      You are one of the most special people in my life.
      I hope your day is filled with happiness, love and beautiful moments. 💕
    </div>

    <br>

    <button onclick="hearts()">Tap For A Surprise 💗</button>

  </div>

</div>

<script>

/* CHANGE THIS DATE */
const unlockDate = new Date("2026-08-20T00:00:00");

function checkDate(){

  const now = new Date();

  if(now >= unlockDate){

    document.getElementById("locked").style.display="none";
    document.getElementById("surprise").style.display="block";

  }else{

    document.getElementById("dateText").innerHTML =
      "🔒 Opens on " + unlockDate.toLocaleDateString();

  }
}

function hearts(){

  for(let i=0;i<35;i++){

    let heart=document.createElement("div");

    heart.className="heartDrop";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDelay=Math.random()*2+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },5000);
  }
}

checkDate();

</script>

</body>
</html>
